  group('렌더 삼각형화 — 감기 방향과 무관하게 윗면 법선은 위를 향한다');
  {
    // 회귀 방지: bimSolids 의 벽 밴드 폴리곤은 시계방향(CW)으로 나온다. CW 를 그대로
    // 부채꼴 삼각형화하면 윗면 법선이 아래를 향해 FrontSide 컬링이 윗면을 지운다 —
    // 렌더링 뷰에서 벽 두께(윗면 밴드)가 사라져 보이던 실사용 버그 (사용자 스크린샷).
    // 소프트웨어 작업 뷰는 양면을 그려 멀쩡했기에 렌더 뷰에서만 드러났다.
    reset();
    if (!C.v3) C.INSTANT_CMDS['view3d']();
    const normalOf = (t) => {   // 삼각형 법선 (z 성분만 보면 위/아래 판정)
      const ux = t[1][0] - t[0][0], uy = t[1][1] - t[0][1], uz = t[1][2] - t[0][2];
      const vx = t[2][0] - t[0][0], vy = t[2][1] - t[0][1], vz = t[2][2] - t[0][2];
      return [uy * vz - uz * vy, uz * vx - ux * vz, ux * vy - uy * vx];
    };
    const topNormals = (poly) => {
      C.v3.solids = [{ eid: 99, poly, z0: 0, z1: 1000, color: '#888888' }];
      const tris = C.rtTrisByEntity().get(99).tris;
      // 윗면 삼각형 = 세 꼭짓점 z 가 모두 1000
      return tris.filter(t => t.every(p => p[2] === 1000)).map(normalOf);
    };
    // 반시계(CCW) 사각형 — 원래도 맞았다
    const ccw = topNormals([[0, 0], [1000, 0], [1000, 1000], [0, 1000]]);
    ok(ccw.length >= 2 && ccw.every(n => n[2] > 0), 'CCW 폴리곤: 윗면 법선이 위(+Z)');
    // ★시계(CW) 사각형 — 예전엔 법선이 아래를 향해 윗면이 사라졌다
    const cw = topNormals([[0, 1000], [1000, 1000], [1000, 0], [0, 0]]);
    ok(cw.length >= 2 && cw.every(n => n[2] > 0), '★CW 폴리곤도 윗면 법선이 위(+Z) — 감기 방향 정규화');
    // ★실제 벽 밴드 (bimSolids 가 내는 그 CW 사다리꼴)
    const band = topNormals([[-2900, -1900], [2900, -1900], [3100, -2100], [-3100, -2100]]);
    ok(band.every(n => n[2] > 0), '★벽 밴드(CW 사다리꼴)의 윗면 법선이 위 — 두께 밴드가 렌더된다');
    // zt/zb 가 폴리곤과 함께 뒤집히는지 (경사 지붕처럼 꼭짓점별 높이가 있을 때)
    C.v3.solids = [{ eid: 98, poly: [[0, 1000], [1000, 1000], [1000, 0], [0, 0]],
      z0: 0, z1: 0, zt: [100, 200, 300, 400], zb: [0, 0, 0, 0], color: '#888888' }];
    const tris98 = C.rtTrisByEntity().get(98).tris;
    // 뒤집힌 뒤에도 각 꼭짓점의 (x,y)↔z 짝이 유지돼야 한다: (0,1000) 꼭짓점의 zt 는 여전히 100
    const hasPair = tris98.some(t => t.some(p => p[0] === 0 && p[1] === 1000 && p[2] === 100));
    ok(hasPair, '★뒤집을 때 꼭짓점별 높이(zt)가 자기 꼭짓점을 따라간다');
    C.v3.solids = C.bimSolids();
  }

  group('덮이는 뷰포트 계약 — 렌더링 뷰·레이트레이싱은 자기 칸에만');
  {
    // 회귀 방지: #rtcv 는 예전에 inset:0 로 오버레이 '전체' 를 덮었고 카메라는 활성 칸 하나만
    // 따랐다. 4분할에서 레이트레이싱을 켜면 격자가 통째로 사라지고 종횡비까지 틀어졌다.
    // (rtEnter/rtResize/rtSyncCamera 어디에도 v3.quad 분기가 없었다)
    // 이제 rview 와 같은 규약이다: rt.vi 에 묶이고, 그 칸 rect 에만 그리고, 이벤트는 통과시킨다.
    reset();
    setEnts([{ id: 1, type: 'LWPOLYLINE', layer: '0', closed: true,
      points: [[-1000, -1000], [1000, -1000], [1000, 1000], [-1000, 1000]], bim: { kind: 'column', base: 0, h: 2000 } }]);
    if (!C.v3) C.INSTANT_CMDS['view3d']();
    const V = C.v3;
    V.quad = false; V.act = 1;

    // 꺼져 있을 때의 계약
    ok(!C.rt.on, '기본 상태 = 레이트레이싱 꺼짐');
    eqi(C.rt.vi, -1, '안 붙어 있으면 rt.vi = -1');
    ok(!C.vpIsRt(0) && !C.vpIsRt(1), '꺼져 있으면 어느 칸도 rt 에 덮이지 않는다');
    ok(!C.vpIsRendered(1), '렌더링 뷰도 꺼짐');

    // ★덮이는 칸의 판정이 두 모드에 대칭이어야 한다 — render3D 가 이걸로 조명 계산을 건너뛴다
    C.rt.on = true; C.rt.vi = 1;
    ok(C.vpIsRt(1), 'rt.vi 칸은 vpIsRt 참');
    ok(!C.vpIsRt(0) && !C.vpIsRt(2), '다른 칸은 거짓 (자기 칸에만)');
    C.rt.on = false; C.rt.vi = -1;

    // ★rtWithVp — 활성이 아닌 칸에 걸어도 그 칸의 카메라로 렌더해야 한다.
    //   v3 는 활성 뷰포트 하나를 전역에 펼쳐놓는 구조(loadVp/saveVp)라 감싸주지 않으면
    //   활성 칸의 카메라로 그려버린다.
    V.quad = true;
    V.views[1].yaw = 1.234; V.views[2].yaw = -0.5;
    // ★loadVp 로 전역까지 맞춰야 한다. rtWithVp 는 첫 줄에서 saveVp() 로 '살아있는 전역'을
    // 활성 칸에 보존하는데(맞는 동작이다 — 조작 중인 카메라를 잃으면 안 되니까),
    // views[] 만 고치고 전역을 안 맞추면 그 saveVp 가 방금 넣은 값을 덮어쓴다. 여기서 한 번 속았다.
    V.act = 2; C.v3.act = 2;
    V.yaw = -0.5; V.pitch = 0; V.zoom = 1; V.panX = 0; V.panY = 0;
    C.rt.vi = 1;
    let seenYaw = null, seenVp = null;
    C.rtWithVp(() => { seenYaw = V.yaw; seenVp = V.vp; });
    eq(seenYaw, 1.234, '★rtWithVp 안에서는 rt 칸(아이소)의 각도가 보인다');
    eq(seenVp.x, C.vpRect(1).x, '★rtWithVp 안에서는 rt 칸의 뷰포트 rect 가 보인다');
    eqi(V.act, 2, '★rtWithVp 를 나오면 활성 칸이 원래대로 (전역을 빌렸다 돌려준다)');
    eq(V.yaw, -0.5, '나오면 활성 칸의 각도로 복원');
    C.rt.vi = -1;

    // rtWithVp 는 예외가 나도 전역을 되돌려야 한다 — 안 그러면 이후 모든 렌더가 엉뚱한 칸을 본다
    C.rt.vi = 1;
    V.act = 2; V.yaw = -0.5;
    try { C.rtWithVp(() => { throw new Error('boom'); }); } catch (_) {}
    eqi(V.act, 2, '★rtWithVp 안에서 예외가 나도 활성 칸이 복원된다 (finally)');
    eq(V.yaw, -0.5, '예외가 나도 각도 복원');
    C.rt.vi = -1;

    // 평면 칸에는 걸 수 없다 (도면 표시 전용)
    ok(C.vpIsPlan(0), '0번은 평면 칸');
    V.quad = false; V.act = 1;
  }

  group('렌더링 뷰 (Rendered) — 명령·노출 계약');
  {
    // 렌더링 뷰 본체(WebGL 픽셀·그림자·컬링)는 실브라우저에서 검증했다 — 여기서는
    // 네트워크(three CDN) 없이 검증 가능한 계약만 못박는다.
    ok(typeof C.INSTANT_CMDS.rendered === 'function', 'rendered 명령이 등록돼 있다');
    eqi(C.CMD_ALIASES['렌더링'], 'rendered', '렌더링 → rendered 별칭');
    eqi(C.CMD_ALIASES['렌더'], 'raytrace', "'렌더' 는 여전히 raytrace (기존 습관 보존)");
    ok(C.rview && C.rview.on === false, 'rview 초기 상태 = 꺼짐');

    const S = C.sunState();

  group('평면 뷰포트는 2D 엔진이 그린다 (평면 이중구현 제거)');
  {
    // 배경: 평면이 두 벌이었다 — 2D 편집기(draw())와 3D의 '평면' 뷰포트.
    // 3D 쪽은 반쪽이었다: renderScene 의 under 루프가 TEXT/HATCH/IMAGE/INSERT 를 통째로 버려서
    // (else continue) 치수는 선만 남고 숫자가 사라졌다. fit3D 도 같은 화이트리스트라 zoom 범위까지 어긋났다.
    // → 이제 mode:'plan' 인 칸은 3D 렌더러가 건너뛰고, #cv(2D 엔진)를 그 칸에 배치해 그린다.
    reset();
    setEnts([
      { id: 1, type: 'LWPOLYLINE', layer: '0', color: '#c8c4bc', closed: true,
        points: [[-1000, -1000], [1000, -1000], [1000, 1000], [-1000, 1000]], bim: { kind: 'column', base: 0, h: 2000 } },
      // 2D 엔진만 그릴 수 있는 것 — 3D 밑그림 경로엔 TEXT 가 아예 없다
      { id: 2, type: 'TEXT', layer: '0', color: '#e04040', x: 0, y: 2600, height: 400, text: 'TXT', rotation: 0 },
    ]);
    if (!C.v3) C.INSTANT_CMDS['view3d']();
    const V = C.v3;
    // ★자기 도형으로 솔리드를 스스로 재빌드 — 앞 그룹이 남긴 v3.solids 에 기대면 안 된다.
    //   (감기 방향 테스트 그룹이 끼어들자 이 그룹이 빈 솔리드로 실행돼 거짓 실패했다)
    V.solids = C.bimSolids();
    const doc = V.cv.ownerDocument;          // 테스트는 iframe 밖이라 앱의 document 를 따로 잡는다
    const cvEl = doc.getElementById('cv');

    eqi(V.views[0].mode, 'plan', "views[0]('평면')은 mode:'plan'");
    ok(!V.views[1].mode, "views[1]('아이소')는 3D 모드 (plan 아님)");
    ok(C.vpIsPlan(0), 'vpIsPlan(0) = 참');
    ok(!C.vpIsPlan(1), 'vpIsPlan(1) = 거짓');

    // ── 4분할: 평면 칸이 떠 있다 ──
    V.quad = true; V.act = 1; C.render3D();
    eqi(C.vpPlanIndex(), 0, '4분할이면 평면 칸 인덱스 = 0');
    const r = C.vpRect(0), Wd = V.cv.width, Hd = V.cv.height;
    ok(r.w > 0 && r.w <= Wd / 2 + 1, '평면 칸 폭 = 캔버스의 절반');
    ok(r.h > 0 && r.h <= Hd / 2 + 1, '평면 칸 높이 = 캔버스의 절반');
    ok(cvEl.style.display !== 'none', '4분할에서 #cv 가 보인다');
    eqi(cvEl.style.position, 'absolute', '#cv 는 평면 칸에 절대배치된다');
    ok(+cvEl.style.zIndex >= 19, '#cv 가 3D 오버레이(z-index 18) 위에 온다');
    // ★3D 렌더러가 평면 칸을 건너뛴다 — 건너뛰지 않으면 반쪽 평면이 되살아난다
    ok(!(V.views[0]._faces && V.views[0]._faces.length), '★3D 렌더러는 평면 칸의 면을 만들지 않는다 (건너뜀)');
    ok(V.views[1]._faces && V.views[1]._faces.length > 0, '아이소 칸은 3D 렌더러가 그대로 그린다');

    // ★핵심: 평면 칸에 문자가 실제로 그려진다 (3D 파이프라인은 TEXT 를 못 그린다)
    C.INSTANT_CMDS.ze();
    const g = cvEl.getContext('2d');
    const d = g.getImageData(0, 0, cvEl.width, cvEl.height).data;
    let red = 0;
    for (let i = 0; i < d.length; i += 4) if (d[i + 3] > 10 && d[i] > 150 && d[i + 1] < 110 && d[i + 2] < 110) red++;
    ok(red > 10, '★평면 칸에 문자(TEXT)가 그려진다 — 2D 엔진이 그리므로');

    // ── 단일 + 아이소: 평면 칸이 없다 → #cv 숨김 ──
    V.quad = false; V.act = 1; C.render3D();
    eqi(C.vpPlanIndex(), -1, '단일 아이소 뷰에는 평면 칸이 없다');
    eqi(cvEl.style.display, 'none', '평면 칸이 없으면 #cv 는 숨는다 (3D 가 화면 전체)');

    // ── 단일 + 평면: #cv 가 화면 전체 ──
    V.quad = false; V.act = 0; C.render3D();
    eqi(C.vpPlanIndex(), 0, '단일 평면 뷰의 평면 칸 인덱스 = 0');
    ok(cvEl.style.display !== 'none', '단일 평면 뷰에서 #cv 가 보인다');
    const rc = C.planCvRect();
    ok(Math.abs(rc.w - Wd / (window.devicePixelRatio || 1)) < 2, '단일 평면이면 #cv 가 캔버스 전체 폭');

    // ── 3D 를 닫으면 오늘과 동일하게 복귀 ──
    C.close3D();
    ok(cvEl.style.display !== 'none', '3D 를 닫으면 #cv 가 다시 보인다');
    eqi(cvEl.style.position, '', '3D 를 닫으면 절대배치가 풀린다 (인라인 스타일 해제)');
    ok(cvEl._w > Wd / (window.devicePixelRatio || 1) / 2, '3D 를 닫으면 #cv 가 화면 전체로 돌아온다');

    // 뒷정리 — 이 그룹은 act=0(평면)으로 끝나고 3D를 닫는다. 그대로 두면 다음 그룹이
    // '평면 칸'을 활성으로 렌더하게 되고, 3D 렌더러가 그 칸을 건너뛰므로 면이 0개가 되어
    // 남의 테스트가 거짓으로 실패한다. 실제로 그렇게 깨뜨렸다.
    C.INSTANT_CMDS['view3d'](); V.quad = false; V.act = 1; C.render3D();
  }

  group('면 피킹은 조명과 무관해야 한다 (extrudesrf 보호)');
  {
    // 회귀 방지: 조명/태양을 켜면 pushLitPoly 가 표시용 면을 잘게 쪼갠다.
    // 피킹이 그 배열을 쓰면 같은 자리를 클릭해도 다른 면(fi)이 잡혀 extrudesrf 면 밀당이 깨진다.
    // 실제로 그렇게 깨뜨린 적이 있다 — 태양 OFF fi=1 / ON fi=0.
    reset();
    setEnts([{ id: 1, type: 'LWPOLYLINE', layer: '0', color: '#c8c4bc', closed: true,
      points: [[-1000, -1000], [1000, -1000], [1000, 1000], [-1000, 1000]], bim: { kind: 'column', base: 0, h: 2000 } }]);
    if (!C.v3) C.INSTANT_CMDS['view3d']();
    const V = C.v3;
    // 앞 그룹/localStorage 가 남긴 레이아웃에 의존하지 않는다.
    // act=0(평면)이면 3D 렌더러가 그 칸을 건너뛰어 면이 0개가 되고, 이 그룹은 무의미해진다.
    V.quad = false; V.act = 1;
    V.pitch = 45 * Math.PI / 180; V.yaw = 0.6;
    C.INSTANT_CMDS.ze();   // 3D 화면 맞춤 (전체보기)
    const hq = () => { V._fast = false; clearTimeout(V._settleT); C.render3D(); };
    const probes = [[0, -1000, 1000], [1000, 0, 1000], [0, 1000, 1000], [-1000, 0, 1000], [0, 0, 2000]];
    const collect = () => probes.map(([x, y, z]) => {
      const p = C.proj3D(x, y, z);
      const f = C.findFaceAt(Math.round(p[0]), Math.round(p[1]));
      return f ? f.fk + '/' + f.fi : 'null';
    }).join(' ');
    const S = C.sunState();
    Object.assign(S, C.sunDefaults(), { mo: 6, d: 21, h: 15, mi: 0, enabled: false });
    hq();
    const off = collect(), facesOff = V.faces.length, pickOff = (V.pick || []).length;
    S.enabled = true; hq();
    const on = collect(), facesOn = V.faces.length, pickOn = (V.pick || []).length;
    ok(facesOn > facesOff, '태양을 켜면 표시용 면은 쪼개진다 (빛 웅덩이)');
    eqi(pickOn, pickOff, '피킹용 면 개수는 조명과 무관하게 같다');
    eqi(on, off, '★같은 자리 클릭 결과가 태양 ON/OFF 에서 동일');
    // 조명 보기(야간)로도 같아야 한다
    S.enabled = false; V.lighting = true; hq();
    const lit = collect();
    eqi(lit, off, '★조명 보기(야간)를 켜도 피킹 결과가 같다');
    V.lighting = false; S.enabled = false;
    // 조작 중(_fast) 에도 같아야 한다 — _fast 는 쪼개기를 건너뛴다
    V._fast = true; C.render3D();
    const fast = collect();
    eqi(fast, off, '★조작 중(_fast)에도 피킹 결과가 같다');
    V._fast = false;
  }

  group('조도 분석 — 조도(lux)·False Color·측정면·CSV');
  {
    if (!C.v3) C.INSTANT_CMDS['view3d']();
    const V3 = C.v3;
    setEnts([
      { type:'LWPOLYLINE', closed:true, layer:'0', points:[[0,0],[6000,0],[6000,4000],[0,4000]], bim:{kind:'slab',t:100,top:0} },
      { type:'LWPOLYLINE', closed:true, layer:'0', points:[[2880,1880],[3120,1880],[3120,2120],[2880,2120]],
        bim:{kind:'column',h:80,base:2550}, light:{ intensity:800, colorTemp:3000 } },
    ]);
    V3.lighting = true; V3._fast = false; V3._occ = null; V3._bounce = null;
    V3.solids = C.bimSolids();
    V3._lights = C.lightSources();
    eqi(V3._lights.length, 1, '광원 1개');
    eq(V3._lights[0].lm, 800, '  광원이 물리 광속(lm)을 들고 있다 — 조도 계산의 근거');

    // ★ 조도는 손계산과 일치해야 한다. 단위(mm→m)를 틀리면 10^6 배 어긋난다 (§3.2)
    const em = C.lightEmitters(S0.entities[1], S0.lights[0])[0];
    const h = em.z / 1000;                       // 발광점 높이 (m)
    const hand = (800 / (4 * Math.PI)) / (h * h); // E = I/d²  (균등 배광)
    const got = C.illuminanceAt(3000, 2000, 0, 0, 0, 1);
    ok(Math.abs(got - hand) / hand < 0.02, '★ 조도가 손계산과 일치 (E = I/d², 단위 m)');
    // 코사인 법칙
    const d = Math.hypot(2000, em.z), cos = em.z / d;
    const hand2 = (800 / (4 * Math.PI)) * cos / Math.pow(d / 1000, 2);
    ok(Math.abs(C.illuminanceAt(5000, 2000, 0, 0, 0, 1) - hand2) / hand2 < 0.02, '  비스듬한 점도 코사인 법칙 일치');
    // 선형성
    S0.lights[0].intensity = 1600; V3._lights = C.lightSources();
    ok(Math.abs(C.illuminanceAt(3000, 2000, 0, 0, 0, 1) - got * 2) / got < 0.01, '  세기 2배 → 조도 정확히 2배');
    S0.lights[0].intensity = 800; V3._lights = C.lightSources();
    ok(C.illuminanceAt(3000, 2000, 0, 0, 0, -1) === 0, '  광원을 등진 면은 0 lux');

    // §4.1 False Color 스케일
    eqi(C.falseColor(250, 500), '#20c060', 'False Color 중간 = 초록');
    eqi(C.falseColor(9999, 500), '#ff3020', '  최대 이상 = 빨강');
    ok(C.falseColor(0, 500) !== C.falseColor(500, 500), '  0과 최대가 다른 색');
    ok(C.falseColor(250, 500) !== C.falseColor(250, 1000), '  스케일 최대값이 색을 바꾼다 (주거 500 / 사무 1000)');
    V3.falseColor = true; V3.fcMax = 500;
    ok(/F500/.test(C.litCacheSig()), '  조도 표시가 조명 캐시 서명에 들어간다 (안 그러면 옛 색이 남는다)');
    V3.falseColor = false;

    // §4.2 측정면
    S0.sensors.length = 0; S0.nextSensorId = 1;
    S0.sensors.push({ id:'S1', x0:0, y0:0, x1:6000, y1:4000, z:750, spacing:500 });
    const st = C.sensorMeasure(S0.sensors[0]);
    eqi(st.n, 117, '측정면 격자: 6000/500+1 × 4000/500+1 = 13×9 = 117점');
    ok(st.min > 0 && st.avg > st.min && st.max > st.avg, '  최소 < 평균 < 최대');
    ok(Math.abs(st.u0 - st.min / st.avg) < 1e-9, '  균제도 U0 = min/avg');

    // §4.2 CSV + §4.3 고지
    const csv = C.sensorCSV();
    const csvLines = csv.split(String.fromCharCode(10));
    eqi(csvLines[0], 'plane,x_mm,y_mm,z_mm,illuminance_lux', 'CSV 헤더');
    eqi(csvLines.filter(l => /^S1,/.test(l)).length, 117, '  측정점 117행');
    ok(/법규·인증용 조도 계산/.test(csv) && /균등 배광/.test(csv), '§4.3 CSV에 정확도 고지 (근사치임을 명시)');

    // 명령·별칭
    eqi(C.CMD_ALIASES['falsecolor'], 'falsecolor', "'falsecolor' 명령");
    eqi(C.CMD_ALIASES['조도'], 'falsecolor', "  한글 별칭 '조도'");
    eqi(C.CMD_ALIASES['측정면'], 'addsensorplane', "  '측정면' → addsensorplane");
    eqi(C.CMD_ALIASES['조도csv'], 'sensorcsv', "  '조도csv' → sensorcsv");
    V3.lighting = false; V3._lights = null; S0.sensors.length = 0;
    reset();
  }

  // ---------- 실제 광원 (조명 보기) ----------
  group('lighting — 지정한 광원이 3D를 실제로 밝힘 (야간 보기)');
  {
    // litFace는 v3(3D 뷰 상태)를 참조하므로 먼저 3D 뷰를 연다
    if (!C.v3) C.INSTANT_CMDS['view3d']();
    const V3 = C.v3;
    ok(!!V3, '3D 뷰 열림 (조명 계산의 전제)');
    const wasOn = V3 && V3.lighting;
    if (V3) V3.lighting = false;

    // litFace: 거리 제곱 감쇠 + 법선 반영
    if (V3) { V3.lighting = true; V3._lights = [{ x:0, y:0, z:2850, range:5000, power:1 }]; }
    const at = x => C.litFace(x, 0, 0, 0, 0, 1, false);
    ok(at(0) > at(2000) && at(2000) > at(4000) && at(4000) > at(8000), '가까울수록 밝다 (거리 제곱 감쇠)');
    ok(at(0) < 1.5, '  광원 바로 아래도 상한에 붙지 않음 (계조 유지)');

    // 조명 캐시 서명에 광원 색이 빠지면, 색온도를 바꿔도 캐시가 살아남아 옛 색이 그대로 남는다
    if (V3) V3._lights = [{ x:0, y:0, z:2850, range:8000, power:1, cr:1, cg:0.7, cb:0.4 }];
    const sigWarm = C.litCacheSig();
    if (V3) V3._lights = [{ x:0, y:0, z:2850, range:8000, power:1, cr:0.8, cg:0.9, cb:1 }];
    const sigCool = C.litCacheSig();
    ok(sigWarm !== sigCool, '★ 광원 색만 바뀌어도 조명 캐시가 무효화된다 (색온도가 화면에 반영되려면 필수)');
    if (V3) V3._lights = [{ x:0, y:0, z:2850, range:5000, power:1 }];

    // 톤매핑 — 밝기 합이 상한을 넘어도 하드 클립되지 않아야 한다.
    // (예전엔 min(1.5)로 잘라, 방 안 전 구간이 1.5로 같아지며 감쇠·그림자 계조가 사라졌다)
    const FAR2 = (8000 * 6) * (8000 * 6);
    if (V3) V3._lights = [{ x:0, y:0, z:2850, range:8000, power:1, far2:FAR2, soft:0, bounce:0 }];
    const hot = C.litFace(0, 0, 0, 0, 0, 1, false);      // 원시 밝기 ≈ 2.5 — 상한 1.5를 넘음
    const warm = C.litFace(2500, 0, 0, 0, 0, 1, false);  // 원시 ≈ 1.8 — 여전히 상한 위
    ok(hot > 1.0 && hot < 1.5, '톤매핑: 상한을 넘는 밝기도 1.5에 붙지 않음');
    ok(warm > 1.0 && warm < 1.5, '  조금 떨어진 곳도 마찬가지');
    ok(hot - warm > 0.03, '  상한 위 구간에서도 밝기 차가 남는다 (하드 클립이면 둘 다 1.5로 같아짐)');
    // 무릎 아래(어두운 곳)는 압축하지 않는다 — 밝기를 2배로 하면 증가분도 정확히 2배(선형)
    if (V3) V3._lights = [{ x:0, y:0, z:2850, range:8000, power:0.05, far2:FAR2, soft:0, bounce:0 }];
    const w1 = C.litFace(0, 0, 0, 0, 0, 1, false);
    if (V3) V3._lights = [{ x:0, y:0, z:2850, range:8000, power:0.10, far2:FAR2, soft:0, bounce:0 }];
    const w2 = C.litFace(0, 0, 0, 0, 0, 1, false);
    ok(w1 < 0.9 && w2 < 0.9, '  약한 빛은 무릎(0.9) 아래');
    ok(Math.abs((w2 - 0.16) - 2 * (w1 - 0.16)) < 1e-9, '  무릎 아래는 압축 없이 선형 — 어두운 곳의 느낌 보존');
    if (V3) V3._lights = [{ x:0, y:0, z:2850, range:5000, power:1 }];
    ok(Math.abs(at(50000) - 0.16) < 0.05, '  아주 먼 곳은 야간 환경광(0.16)으로 수렴');
    ok(C.litFace(0, 0, 0, 0, 0, -1, false) < 0.2, '광원을 등진 면은 어둡다');
    // power / range 특성
    if (V3) V3._lights = [{ x:0, y:0, z:2850, range:5000, power:2 }];
    const p2 = C.litFace(4000, 0, 0, 0, 0, 1, false);
    if (V3) V3._lights = [{ x:0, y:0, z:2850, range:5000, power:1 }];
    const p1 = C.litFace(4000, 0, 0, 0, 0, 1, false);
    ok(p2 > p1, 'power를 올리면 밝아짐');
    if (V3) V3._lights = [{ x:0, y:0, z:2850, range:1500, power:1 }];
    ok(C.litFace(4000, 0, 0, 0, 0, 1, false) < p1, 'range를 줄이면 먼 곳이 더 어두워짐');
    if (V3) { V3.lighting = false; V3._lights = null; }

    // lightSources: 지정한 개체 → 광원 (개체가 놓인 z 그대로)
    setEnts([{ type:'LINE', x1:0, y1:0, x2:6000, y2:0, layer:'0', zo:2800,
               light:{spacing:6000} }]);
    const src = C.lightSources();
    eqi(src.length, 2, 'lightSources: 발광 지점마다 광원 1개');
    eq(src[0].z, 2800, '  광원 높이 = 개체가 놓인 z (zo)');
    eq(src[0].soft, 400, '  soft 기본 400 (부드러운 그림자 기본 ON)');
    eq(src[0].bounce, 0.5, '  bounce 기본 0.5 (간접광 기본 ON)');
    eq(src[0].range, 3000, '  range 기본 3000 — 키우면 방 안에서 감쇠가 사라져 다시 하얗게 뜬다');
    eq(src[0].power, 1, '  power 기본 1 (특성창 라벨 "1=기본"과 일치)');
    // 광원 지정이 없으면 광원 0
    setEnts([{ type:'LINE', x1:0, y1:0, x2:1000, y2:0, layer:'0' }]);
    eqi(C.lightSources().length, 0, '광원으로 지정하지 않으면 광원 없음');

    // ── 그림자 ──
    // 바닥 + 조명(x=0) + 벽(x=2000) → 벽 뒤는 그림자, 벽을 지우면 밝아져야 (대조군)
    setEnts([
      { type:'LWPOLYLINE', closed:true, points:[[-12000,-6000],[12000,-6000],[12000,6000],[-12000,6000]], layer:'0', bim:{kind:'slab', t:100, top:0} },
      { type:'LINE', x1:0, y1:-1, x2:0, y2:1, layer:'0', zo:2850, light:{spacing:99999, range:8000, intensity:960, color:[255,255,255]} },
      { type:'LINE', x1:2000, y1:-4000, x2:2000, y2:4000, layer:'0', bim:{kind:'wall', h:2500, t:200, base:0} },
    ]);
    if (V3) {
      V3.lighting = true; V3._fast = false;
      V3.solids = C.bimSolids();
      V3._lights = C.lightSources();
      V3._occ = C.shadowOccluders();
      ok(V3._occ.length > 0, '가림 형상(벽·바닥) 수집됨');
      // 광원으로 지정한 개체는 가림에서 빠져야 한다 — 안 그러면 자기 형상이 자기 빛을 막아 캄캄해진다
      const before = C.shadowOccluders().length;
      S0.entities.push({ id: 999, type:'LWPOLYLINE', closed:true, layer:'0',
        points:[[-500,-500],[500,-500],[500,500],[-500,500]], bim:{kind:'column', h:400, base:2600} });
      V3.solids = C.bimSolids();
      const withCube = C.shadowOccluders().length;
      const cube = S0.entities[S0.entities.length-1];   // 같은 정육면체를 광원으로 지정
      S0.lights.push({ id:'LX', objectId:cube.id, name:'cube', type:'emissive', enabled:true,
        intensity:800, colorTemp:3000, color:null, range:3000, soft:400, bounce:0.5 });
      cube.lightId = 'LX';
      V3.solids = C.bimSolids();
      const asLight = C.shadowOccluders().length;
      ok(withCube > before, '  정육면체를 넣으면 가림 삼각형이 늘어난다 (대조군)');
      eqi(asLight, before, '  그 정육면체를 광원으로 지정하면 가림에서 빠진다 (자기 빛을 안 막음)');
      S0.entities.pop(); S0.lights.pop(); V3.solids = C.bimSolids();
      const at = x => C.litFace(x, 0, 0, 0, 0, 1, false);
      ok(at(1000) > 0.8, '조명과 벽 사이(벽 앞) 바닥은 밝다');
      ok(at(4000) < 0.3, '벽 뒤 바닥은 그림자 (환경광만)');
      ok(at(7000) < 0.3, '  더 멀리도 그림자 안');
      ok(at(1000) - at(4000) > 0.5, '  그림자 경계가 뚜렷');
      // 대조군: 벽을 지우면 같은 자리가 밝아져야 = 그림자의 원인이 벽임을 증명
      S0.entities = S0.entities.filter(e => !(e.bim && e.bim.kind === 'wall'));
      V3.solids = C.bimSolids();
      V3._occ = C.shadowOccluders();
      ok(C.litFace(4000, 0, 0, 0, 0, 1, false) > 0.8, '벽을 지우면 같은 자리가 밝아짐 (그림자의 원인 = 벽)');
      V3._occ = null; V3._lights = null; V3.lighting = false;
    }

    // ── 부드러운 그림자(펜엄브라) ──
    // 램프를 넓이가 있는 광원으로 보고 여러 점을 샘플 → 보이는 비율이 곧 빛의 세기.
    setEnts([
      { type:'LWPOLYLINE', closed:true, points:[[-12000,-6000],[12000,-6000],[12000,6000],[-12000,6000]], layer:'0', bim:{kind:'slab', t:100, top:0} },
      { type:'LINE', x1:0, y1:-1, x2:0, y2:1, layer:'0', zo:2850, light:{spacing:99999, range:20000, intensity:960, color:[255,255,255]} },
      { type:'LINE', x1:2000, y1:-5000, x2:2000, y2:5000, layer:'0', bim:{kind:'wall', h:1500, t:200, base:0} },
    ]);
    if (V3) {
      V3.lighting = true; V3._fast = false;
      V3.solids = C.bimSolids();
      V3._lights = C.lightSources();
      V3._occ = C.shadowOccluders();
      const scan = sv => {
        for (const g of V3._lights) g.soft = sv;
        const r = [];
        for (let x = 3200; x <= 4800; x += 100) r.push(C.litFace(x, 0, 0, 0, 0, 1, false));
        return r;
      };
      const midCount = a => a.filter(v => v > 0.25 && v < 1.3).length; // 반그림자(중간 밝기) 개수
      const hard = scan(0), soft = scan(800), softer = scan(2000);
      eqi(midCount(hard), 0, '하드(soft=0): 그림자 경계가 계단 — 중간 밝기 없음');
      ok(midCount(soft) > 0, '부드러운 그림자(soft=800): 경계에 반그림자(중간 밝기) 생김');
      ok(midCount(softer) >= midCount(soft), '광원이 클수록(soft=2000) 반그림자가 더 넓다');
      ok(hard.some(v => v < 0.2) && hard.some(v => v > 1.2), '  하드도 그림자/빛 양쪽은 그대로');
      // 광원 크기 0 = 점광원 → visFraction이 0 또는 1만 반환
      for (const g of V3._lights) g.soft = 0;
      const vf = C.visFraction(1000, 0, 0, V3._lights[0], V3._lights[0].x - 1000, V3._lights[0].y, V3._lights[0].z, Math.hypot(1000, V3._lights[0].z));
      ok(vf === 0 || vf === 1, 'soft=0이면 가림 판정이 0/1 (점광원)');
      V3._occ = null; V3._lights = null; V3.lighting = false;
    }

    // ── 간접광 (1회 반사) ──
    // 방 + 가운데 조명 + 가림벽 → 그림자 안이 바닥·벽에 튕긴 빛으로 밝아져야 (단, 직접광보다는 어둡게)
    setEnts([
      { type:'LWPOLYLINE', closed:true, points:[[-8000,-5000],[8000,-5000],[8000,5000],[-8000,5000]], layer:'0', bim:{kind:'slab', t:100, top:0} },
      { type:'LWPOLYLINE', closed:true, points:[[-8000,-5000],[8000,-5000],[8000,5000],[-8000,5000]], layer:'0', bim:{kind:'wall', h:3000, t:200, base:0} },
      { type:'LINE', x1:0, y1:-1, x2:0, y2:1, layer:'0', zo:2650, light:{spacing:99999, range:8000, intensity:960, soft:400, color:[255,255,255]} },
      { type:'LINE', x1:2000, y1:-4000, x2:2000, y2:4000, layer:'0', bim:{kind:'wall', h:2000, t:200, base:0} },
    ]);
    if (V3) {
      V3.lighting = true; V3._fast = false;
      V3.solids = C.bimSolids();
      V3._lights = C.lightSources();
      V3._occ = C.shadowOccluders();
      const at = x => C.litFace(x, 0, 0, 0, 0, 1, false);

      V3._bounce = null; // 간접광 없이
      const offShadow = at(4000), lit = at(1000);
      eq(offShadow, 0.16, '간접광 없으면 그림자 안은 환경광으로 균일');

      for (const g of V3._lights) g.bounce = 0.5;
      V3._bounce = C.bounceLights();
      ok(V3._bounce.length > 0, '2차 광원(반사광)이 생성됨');
      ok(V3._bounce.length <= 96, '  2차 광원 수에 상한이 있다 (성능)');
      const onShadow = at(4000);
      ok(onShadow > offShadow, '그림자 안이 반사광으로 밝아짐 (균일하지 않게 됨)');
      ok(onShadow < lit * 0.5, '  그래도 직접광의 절반 이하 — 여전히 그림자로 보인다');
      ok(at(4000) > at(6000), '  반사광도 거리에 따라 감쇠');
      // 세기 조절
      for (const g of V3._lights) g.bounce = 1.5;
      V3._bounce = C.bounceLights();
      ok(at(4000) > onShadow, '간접광 세기를 올리면 더 밝아짐');
      // 끄기
      for (const g of V3._lights) g.bounce = 0;
      V3._bounce = C.bounceLights();
      eqi(V3._bounce.length, 0, 'bounce=0이면 간접광 끔 (2차 광원 없음)');
      eq(at(4000), 0.16, '  끄면 그림자 안이 다시 균일');
      V3._bounce = null; V3._occ = null; V3._lights = null; V3.lighting = false;
    }

    // ── 색번짐 (컬러 블리딩) ──
    // 회색 바닥 + 색 있는 벽 → 반사광이 벽 색을 옮겨와 바닥이 그 색으로 물든다.
    const bleed = (wallColor, bounce) => {
      setEnts([
        { type:'LWPOLYLINE', closed:true, points:[[-6000,-4000],[6000,-4000],[6000,4000],[-6000,4000]], layer:'0', color:'#9a9a9a', bim:{kind:'slab', t:100, top:0} },
        { type:'LINE', x1:-3000, y1:0, x2:-3000, y2:1, layer:'0', zo:2375, light:{spacing:99999, range:9000, intensity:960, soft:300, bounce, color:[255,255,255]} },
        { type:'LINE', x1:2000, y1:-4000, x2:2000, y2:4000, layer:'0', color:wallColor, bim:{kind:'wall', h:2500, t:200, base:0} },
      ]);
      V3.lighting = true; V3._fast = false;
      V3.solids = C.bimSolids();
      V3._lights = C.lightSources();
      V3._occ = C.shadowOccluders();
      V3._bounce = C.bounceLights();
      C.litFace(1700, 0, 0, 0, 0, 1, false);
      return [C.LIT_RGB[0], C.LIT_RGB[1], C.LIT_RGB[2], C.LIT_RGB[3]];
    };
    if (V3) {
      const off = bleed('#ff2020', 0);
      eqi(off[3], 0, '간접광이 꺼져 있으면 색조 없음 (채널별 밝기 미사용 = 기존 렌더 경로)');
      const red = bleed('#ff2020', 0.8);
      eqi(red[3], 1, '빨간 벽 + 간접광 → 색조 발생');
      ok(red[0] > red[1] && red[0] > red[2], '  회색 바닥의 R 채널이 G·B보다 밝다 (붉게 물듦)');
      const grn = bleed('#20ff20', 0.8);
      ok(grn[1] > grn[0] && grn[1] > grn[2], '초록 벽 → 바닥의 G 채널이 가장 밝다');
      const gry = bleed('#9a9a9a', 0.8);
      eqi(gry[3], 0, '회색 벽 → 색조 없음 (채널이 고르면 스칼라 경로로)');
      // 실제 칠해질 색
      const c = C.shadeColor3('#9a9a9a', red);
      ok(c[0] > c[1] && c[0] > c[2], '실제 칠해지는 색도 붉은 회색이 된다');
      // shadeColor3 자체
      const t = C.shadeColor3('#808080', [1, 0.5, 0.5]);
      eqi(t[0], 128, 'shadeColor3: R 채널 그대로'); eqi(t[1], 64, '  G 채널 절반'); eqi(t[2], 64, '  B 채널 절반');
      V3._bounce = null; V3._occ = null; V3._lights = null; V3.lighting = false;
    }

    if (V3) V3.lighting = !!wasOn;
    reset();
  }

  // ---------- 명령어 체계: 라이노 이름 + 2D/3D 분리 재발 방지 ----------
  group('명령어 체계 — 라이노 이름 준수 / 평면·3D 전용 분리 금지');
  {
    const A = C.CMD_ALIASES;
    const canon = [...new Set(Object.values(A))];

    // 1) "move / 3dmove"처럼 차원별로 쪼갠 명령이 다시 생기면 실패 — 사용자가 명시적으로 금지한 패턴.
    //    view3d는 편집 명령이 아니라 뷰 전환 토글이므로 예외.
    const VIEW_OK = ['view3d'];
    const split = canon.filter(n => !VIEW_OK.includes(n) && /(^|[^a-z])[23]d|[23]d$/.test(n));
    ok(split.length === 0, '차원별로 쪼갠 명령 없음 (있으면: ' + (split.join(', ') || '없음') + ')');

    // 2) 과거에 존재했던 분리 명령들이 완전히 사라졌는지
    for (const dead of ['move3d','3dmove','copy3d','3dcopy','mirror3d','array3d','scale3d','rotate3d','fillet3d','intersect3d'])
      ok(!A[dead], `분리 명령 '${dead}' 제거됨`);

    // 3) 공용 명령은 하나로 — 평면/3D 구분 없이 같은 이름
    for (const [k, want] of [['move','move'],['m','move'],['copy','copy'],['co','copy'],
                             ['rotate','rotate'],['mirror','mirror'],['scale','scale'],['array','array']])
      eqi(A[k], want, `'${k}' → ${want} (평면·3D 공용)`);

    // 4) 라이노 정식 이름/단축키가 동작해야 (노드 개발 시 호환성 기준)
    for (const [k, want] of [
      ['booleanunion','booleanunion'], ['bu','booleanunion'], ['union','booleanunion'],
      ['booleandifference','booleandifference'], ['bd','booleandifference'], ['difference','booleandifference'],
      ['booleanintersection','booleanintersection'], ['bi','booleanintersection'], ['boolint','booleanintersection'],
      ['filletedge','filletedge'], ['fe','filletedge'],
      ['distance','dist'], ['matchproperties','matchprop'], ['curve','spline'], ['interpcrv','spline'],
      ['polyline','pline'], ['rectangle','rect'], ['delete','erase'], ['extrude','extrudecrv'],
    ]) eqi(A[k], want, `라이노 이름 '${k}' → ${want}`);

    // 5) 별칭이 가리키는 정식 이름은 전부 실행 가능해야 — 즉시실행(INSTANT_CMDS) 아니면 도구(TOOL_KO).
    //    둘 다 아니면 입력해도 아무 일도 안 일어나는 죽은 명령이다.
    const dead = canon.filter(n => !C.INSTANT_CMDS[n] && !C.TOOL_KO[n]);
    ok(dead.length === 0, '죽은 별칭 없음 — 모든 정식 이름이 실행 가능 (' + (dead.join(', ') || '없음') + ')');
  }

  // ---------- 이미지 DXF 보존 ----------
  group('이미지 — DXF 저장/불러오기 보존 (999 WCX)');
  {
    const SRC = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==';
    setEnts([
      { type:'IMAGE', layer:'밑그림', x:-10, y:-20, w:100, h:60, src:SRC, rot:33, op:0.6, sat:1.4, bri:0.8, flip:true },
      { type:'LINE', x1:0, y1:0, x2:100, y2:0, layer:'0' },
    ]);
    S0.layers = [{name:'0',color:'#ffffff',visible:true},{name:'밑그림',color:'#8a8a94',visible:true}];
    const dxf = C.buildDXFText();
    ok(dxf.includes('999'), 'DXF에 999 WCX 블록 존재');
    ok(!/^\s*0\s*\nIMAGE\s*$/m.test(dxf), '표준 DXF 엔티티로는 IMAGE를 쓰지 않음 (외부 파일 참조 방식이라 라이노에서 깨짐)');

    C.loadDXF(dxf, 'rt.dxf');
    const im = S0.entities.find(e => e.type === 'IMAGE');
    ok(!!im, '왕복 후 이미지가 살아남음 (예전엔 저장하면 사라졌음)');
    if (im) {
      eq(im.x, -10, '  x 보존'); eq(im.y, -20, '  y 보존');
      eq(im.w, 100, '  폭 보존'); eq(im.h, 60, '  높이 보존');
      eq(im.rot, 33, '  회전 보존');
      eq(im.op, 0.6, '  투명도 보존'); eq(im.sat, 1.4, '  채도 보존'); eq(im.bri, 0.8, '  명도 보존');
      ok(im.flip === true, '  좌우반전 보존');
      eqi(im.src, SRC, '  이미지 데이터 무손실');
      eqi(im.layer, '밑그림', '  레이어 보존');
    }
    ok(S0.entities.some(e => e.type === 'LINE'), '일반 도형도 함께 보존(공존)');
    // id 충돌 없이 복원되어야 (선택·삭제가 엉뚱한 객체를 잡는 것 방지)
    const ids = S0.entities.map(e => e.id);
    eqi(new Set(ids).size, ids.length, '복원된 이미지 id가 기존 도형과 겹치지 않음');
    ok(S0.nextId > Math.max(...ids), 'nextId가 최대 id보다 큼');
    reset();
  }

  // ---------- 스케치 엔진 (새 철학 Phase 1) ----------
  group('스케치 엔진 1단계 — 필압 보존·팜 리젝션·월드 정합·undo·지우개·영속');
  {
    // 철학: 손그림은 끝까지 손그림 — 원본 점열(좌표+필압)이 그대로 저장되어야
    // Phase 2 전처리 엔진의 입력이 된다. AI 사용 0.
    const AW = document.getElementById('app').contentWindow, AD = AW.document;
    const S = AW.WEBCAD_SKETCH;
    ok(!!S, '★WEBCAD_SKETCH 모듈 로드');
    if (S) {
      const skcv = AD.getElementById('skcv');
      ok(!!skcv && !!AD.getElementById('btnSketch'), '오버레이 캔버스 + 상단바 ✏️ 진입 버튼');
      const key = S.SK.docKey, bak = AW.localStorage.getItem(key); // 사용자 스케치 보호
      S.SK.strokes.length = 0; S.SK.penSeen = false; S.SK.rev++;
      S.enter(); S.syncNow();
      eqi(AW.getComputedStyle(skcv).pointerEvents, 'auto', '스케치 모드 = 오버레이가 입력을 받음');
      const r = skcv.getBoundingClientRect();
      const pd = (type, x, y, p, id, pt) => skcv.dispatchEvent(new AW.PointerEvent(type, {
        pointerId: id, pointerType: pt || 'pen', pressure: p, clientX: r.left + x, clientY: r.top + y,
        buttons: 1, button: 0, bubbles: true, cancelable: true, isPrimary: true }));
      pd('pointerdown', 80, 80, 0.2, 901);
      pd('pointermove', 130, 95, 0.6, 901);
      pd('pointermove', 180, 120, 0.9, 901);
      pd('pointerup', 180, 120, 0.9, 901);
      eqi(S.SK.strokes.length, 1, '★펜 스트로크 생성');
      const st = S.SK.strokes[0];
      ok(st.pts.length >= 3, '점열 보존 (' + st.pts.length + '점)');
      eq(st.pts[0][2], 0.2, '★필압 시작 보존', 0.02);
      eq(st.pts[st.pts.length - 1][2], 0.9, '★필압 끝 보존', 0.02);
      const back = S.w2s(st.pts[0][0], st.pts[0][1]);
      eq(back[0], 80, '★월드 좌표 저장 — 화면 x 왕복', 1.2);
      eq(back[1], 80, '  화면 y 왕복', 1.2);
      // 잉크 픽셀이 실제로 찍혔나
      S.syncNow();
      {
        const dpr = AW.devicePixelRatio || 1, gg = skcv.getContext('2d');
        const d = gg.getImageData(Math.max(0, Math.round(130 * dpr) - 2), Math.max(0, Math.round(95 * dpr) - 2), 6, 6).data;
        let m = 0; for (let i = 3; i < d.length; i += 4) m = Math.max(m, d[i]);
        ok(m > 0, '★잉크 픽셀 렌더 (α=' + m + ')');
      }
      // 팜 리젝션 — 펜 사용 후 손가락 한 개는 그리지 않는다
      pd('pointerdown', 120, 140, 0.5, 902, 'touch');
      pd('pointermove', 160, 150, 0.5, 902, 'touch');
      pd('pointerup', 160, 150, 0.5, 902, 'touch');
      eqi(S.SK.strokes.length, 1, '★팜 리젝션 — 펜 사용 후 한 손가락 무시');
      // 지우개 + 전용 undo/redo (CAD undo 와 독립)
      S.setTool('eraser');
      pd('pointerdown', 130, 95, 0.5, 903);
      pd('pointerup', 130, 95, 0.5, 903);
      eqi(S.SK.strokes.length, 0, '★지우개 — 스트로크 단위 제거');
      S.undoSk(); eqi(S.SK.strokes.length, 1, 'undo → 지우기 복원');
      S.undoSk(); eqi(S.SK.strokes.length, 0, 'undo → 그리기 취소');
      S.redoSk(); eqi(S.SK.strokes.length, 1, 'redo → 재생성');
      // 영속 왕복 (문서별 localStorage)
      S.saveNow();
      S.SK.strokes.length = 0;
      S.loadNow();
      eqi(S.SK.strokes.length, 1, '★영속 — 저장/복원 왕복');
      // 종료: CAD 입력 원복 + Sketch Layer 는 계속 표시(공존 철학)
      S.setTool('pen'); S.exit(); S.syncNow();
      eqi(AW.getComputedStyle(skcv).pointerEvents, 'none', '종료 = CAD 입력 원복');
      ok(S.SK.visible, 'Sketch Layer 는 종료 후에도 표시(CAD 와 공존)');
      // 정리 — 사용자 스케치 복구
      S.SK.strokes.length = 0; S.SK.rev++;
      if (bak == null) AW.localStorage.removeItem(key); else AW.localStorage.setItem(key, bak);
      S.loadNow(); S.syncNow();
    }
  }

  // ---------- 전처리 엔진 (새 철학 Phase 2, AI 0) ----------
  group('전처리 엔진 — 손그림 → 직선·원·호·사각 인식 + 직교 정리 + 닫힌 영역 + 요약');
  {
    // 손그림 시뮬: 미세 흔들림(±8mm) + 실제 손이 내는 끝점 벌어짐(gap)을 재현한다.
    const AW = document.getElementById('app').contentWindow;
    const P = AW.WEBCAD_PREP;
    ok(!!P, '★WEBCAD_PREP 모듈 로드');
    if (P) {
      let sid = 1;
      const mk = (pts) => ({ id: sid++, color: '#e6e1d3', hw: 3,
        pts: pts.map((p, i) => [p[0] + Math.sin(i * 1.7 + sid) * 8, p[1] + Math.cos(i * 1.1 + sid * 2) * 8, 0.5]) });
      const seg = (x1, y1, x2, y2, n) => { n = n || 30; return Array.from({ length: n + 1 }, (_, i) => [x1 + (x2 - x1) * i / n, y1 + (y2 - y1) * i / n]); };
      // 직선 + 직교 정리
      let a = P.analyze([mk(seg(0, 0, 2000, 30))]);
      eqi(a.shapes[0].kind, 'line', '★흔들리는 선 → 직선');
      ok(a.shapes[0].ortho && Math.abs(a.shapes[0].a[1] - a.shapes[0].b[1]) < 0.01, '★수평 직교 정리');
      eq(a.shapes[0].lengthMM, 2000, '길이 근사', 60);
      // 한 획 사각형 (끝 gap 120mm) → rect + 자기 영역
      const sq = [...seg(0, 0, 4000, 20, 25), ...seg(4000, 20, 3980, 3000, 20), ...seg(3980, 3000, 10, 2980, 25), ...seg(10, 2980, 20, 120, 20)];
      a = P.analyze([mk(sq)]);
      eqi(a.shapes[0].kind, 'rect', '★한 획 사각형 → rect (직교 스냅)');
      eqi(a.regions.length, 1, '  자기 닫힘 영역 1');
      eq(a.regions[0].areaMM2 / 1e6, 12, '  면적 ≈ 12㎡ (4×3m)', 0.8);
      // 원
      const cir = Array.from({ length: 40 }, (_, i) => { const t = i / 39 * Math.PI * 2.05; return [Math.cos(t) * 800, Math.sin(t) * 800]; });
      a = P.analyze([mk(cir)]);
      eqi(a.shapes[0].kind, 'circle', '★원 인식');
      eq(a.shapes[0].r, 800, '  반지름', 40);
      // 호 (반원)
      const half = Array.from({ length: 20 }, (_, i) => { const t = i / 19 * Math.PI; return [Math.cos(t) * 600, Math.sin(t) * 600]; });
      a = P.analyze([mk(half)]);
      eqi(a.shapes[0].kind, 'arc', '★반원 → 호');
      // L자 → 꺾은선 (호로 오인 금지 — 90° 꺾임)
      a = P.analyze([mk([...seg(0, 0, 2000, 10), ...seg(2000, 10, 2020, 1500)])]);
      eqi(a.shapes[0].kind, 'polyline', 'L자 → 꺾은선 (호 오인 없음)');
      // 별도 4획 방 → 끝점 병합으로 닫힌 영역
      const st4 = [mk(seg(0, 0, 3950, 25)), mk(seg(4010, 60, 3980, 2960)), mk(seg(3950, 3010, 40, 2990)), mk(seg(-20, 2950, 15, 55))];
      a = P.analyze(st4);
      ok(a.shapes.every(s => s.kind === 'line'), '4획 전부 직선 (호 오인 없음)');
      eqi(a.regions.length, 1, '★4획 끝점 병합 → 닫힌 영역 1');
      eq(a.regions[0].areaMM2 / 1e6, 11.8, '  면적 ≈ 12㎡', 0.9);
      // T자 칸막이 → 두 방 (몸통 접합 분할)
      a = P.analyze([...st4.map(s => ({ ...s })), mk(seg(2000, 20, 1990, 2985))]);
      eqi(a.regions.length, 2, '★T자 칸막이 → 닫힌 영역 2 (몸통 접합 분할)');
      eq(a.regions.reduce((x, r) => x + r.areaMM2, 0) / 1e6, 11.7, '  두 방 면적 합', 0.9);
      // 구조화 요약 — Phase 3 에서 AI 에 보낼 데이터 (이미지 없음)
      ok(a.summary && a.summary.unit === 'mm' && a.summary.shapes.length === 5 && a.summary.regions.length === 2,
        '★구조화 요약 생성 (unit·shapes·regions)');
      ok(JSON.stringify(a.summary).length < 2000, '  요약은 콤팩트 (이미지 전송 대비 수백 토큰)');
    }
  }

  group('스케치 ✨ 인식 UI — 미리보기 → CAD 만들기 (손그림 보존)');
  {
    const AW = document.getElementById('app').contentWindow, AD = AW.document;
    const S = AW.WEBCAD_SKETCH, C2 = T;
    if (S && AW.WEBCAD_PREP) {
      reset();
      const key = S.SK.docKey, bak = AW.localStorage.getItem(key);
      S.SK.strokes.length = 0; S.SK.rev++;
      // 프로그램적으로 스트로크 주입 (월드 mm)
      const jig = (pts) => pts.map((p, i) => [p[0] + Math.sin(i * 2.1) * 6, p[1] + Math.cos(i * 1.3) * 6, 0.5]);
      const seg = (x1, y1, x2, y2) => Array.from({ length: 25 }, (_, i) => [x1 + (x2 - x1) * i / 24, y1 + (y2 - y1) * i / 24]);
      S.SK.strokes.push(
        { id: 9001, color: '#e6e1d3', hw: 10, pts: jig(seg(0, 0, 4000, 20)) },
        { id: 9002, color: '#e6e1d3', hw: 10, pts: jig(seg(4020, 40, 3990, 2970)) },
        { id: 9003, color: '#e6e1d3', hw: 10, pts: jig(seg(3960, 3010, 30, 2990)) },
        { id: 9004, color: '#e6e1d3', hw: 10, pts: jig(seg(-10, 2960, 10, 40)) });

      const before = C2.state.entities.length;

      ok(!!C2.state.layers.find(l => l.name === '스케치 인식'), '  레이어 자동 생성');
      eqi(S.SK.strokes.length, 0, '★변환 후 스케치 선 자동 정리 (피드백 ① — 도면과 안 겹침)');
      S.undoSk(); eqi(S.SK.strokes.length, 4, '  스케치 Ctrl+Z 로 손그림 복원'); S.redoSk();
      ok(!S.getPreview(), '커밋 후 미리보기 해제');
      // 정리
      S.SK.strokes.length = 0; S.SK.rev++;
      if (bak == null) AW.localStorage.removeItem(key); else AW.localStorage.setItem(key, bak);
      S.loadNow(); reset();
    } else ok(!!S, '(모듈 없음 — 로드만 확인)');
  }

  // ---------- 해석 파이프라인 (새 철학 Phase 3) ----------
  group('해석 파이프라인 — 스케일 정규화 · 규칙 역할판정 · 손그림→BIM 생성 (AI 는 선택 보정)');
  {
    const AW = document.getElementById('app').contentWindow;
    const S = AW.WEBCAD_SKETCH, P = AW.WEBCAD_PREP, BF = AW.WEBCAD_BIMIFY;
    ok(!!BF, '★WEBCAD_BIMIFY 모듈 로드');
    if (BF && S && P) {
      reset();
      const key = S.SK.docKey, bak = AW.localStorage.getItem(key);
      S.SK.strokes.length = 0; S.SK.rev++;
      let sid = 800;
      const jig = (pts) => pts.map((p, i) => [p[0] + Math.sin(i * 2.1 + sid) * 1.2, p[1] + Math.cos(i * 1.3 + sid) * 1.2, 0.5]);
      const seg = (x1, y1, x2, y2) => Array.from({ length: 25 }, (_, i) => [x1 + (x2 - x1) * i / 24, y1 + (y2 - y1) * i / 24]);
      const add = (pts, color, hw) => S.SK.strokes.push({ id: sid++, color: color || '#e6e1d3', hw: hw || 1, pts: jig(pts) });
      // 화면 감각으로 작게(400×300mm) 그린 방 + T자 칸막이 + 문 호
      add(seg(0, 0, 400, 2)); add(seg(402, 4, 398, 297)); add(seg(396, 301, 3, 299)); add(seg(-1, 296, 1, 4));
      add(seg(150, 2, 149, 298));
      const arc = []; for (let i = 0; i <= 12; i++) { const t2 = Math.PI / 2 + i / 12 * Math.PI / 2; arc.push([280 + Math.cos(t2) * 60, 0 + Math.sin(t2) * 60]); }
      add(arc, '#e0a33a', 0.8);
      S.SK.rev++;
      const pv0 = S.recognize();
      // ① 스케일 정규화 — 최대 방 ≈ 18㎡ 기준의 '나이스' 배율
      const k = BF.calcScale(pv0);
      ok(k >= 10 && k <= 30, '★작은 스케치 → 스케일 배율 산출 (×' + k + ')');
      // 실척 스케치는 그대로
      const real = P.analyze([{ id: 1, color: '#fff', hw: 3, pts: seg(0, 0, 4000, 10).concat(seg(4000, 10, 3990, 3000), seg(3990, 3000, 5, 2990), seg(5, 2990, 0, 5)).map(p => [p[0], p[1], 0.5]) }]);
      eqi(BF.calcScale(real), 1, '실척(4×3m) 스케치는 배율 1');
      // ②③ 파이프라인을 조각별로 동기 실행 — buildBuilding 의 실제 순서 그대로:
      //    ★스케일 먼저, 판정은 그 다음 (규칙 임계값은 건축 스케일 기준이다)
      for (const st of S.SK.strokes) { st.hw *= k; st.pts = st.pts.map(p => [p[0] * k, p[1] * k, p[2]]); }
      const anal = P.analyze(S.SK.strokes);
      const roles = BF.heuristic(anal);
      const vals = Object.values(roles);
      eqi(vals.filter(r => r === 'wall').length, 5, '★스케일 후 규칙 판정: 벽 5 (외벽 4 + 칸막이)');
      eqi(vals.filter(r => r === 'door').length, 1, '★문 호 → door');
      const before = C.state.entities.length;
      const counts = BF.build(anal, roles);
      eqi(counts.wall, 5, '★벽 5개 생성 (LINE + bim wall)');
      eqi(counts.door, 1, '★문 1개 (벽 위 opening)');
      eqi(counts.slab, 2, '★바닥 슬래브 2 (두 방 자동)');
      const ents = C.state.entities.slice(before);
      const wall = ents.find(e => e.bim && e.bim.kind === 'wall');
      ok(wall && wall.type === 'LINE' && wall.bim.t === 200 && wall.bim.h === 2400 && wall.layer === '벽', '벽 속성 (t200·h2400·벽 레이어)');
      const door = ents.find(e => e.bim && e.bim.kind === 'opening');
      const dw = door ? Math.hypot(door.x2 - door.x1, door.y2 - door.y1) : 0;
      ok(door && door.bim.ot === 'door' && dw > 400 && dw < 1500, '문 폭 상식 범위 (' + Math.round(dw) + 'mm)');
      ok(ents.some(e => e.bim && e.bim.kind === 'slab' && e.type === 'LWPOLYLINE' && e.closed), '슬래브 = 닫힌 LWPOLYLINE');
      // 스케일 후에도 손그림-건물 정합 (스트로크도 같이 커졌다)
      const maxX = Math.max(...S.SK.strokes.flatMap(s => s.pts.map(p => p[0])));
      ok(Math.abs(maxX - 402 * k) < 40, '★스케치도 같은 배율 — 건물과 정합 유지');
      eqi(S.SK.strokes.length, 6, '손그림 보존');
      ok(typeof S.buildBuilding === 'function' && typeof BF.classify === 'function', 'async 래퍼(AI 보정 경로) 존재');
      ok(BF.aiPrompt(anal, roles).length < 1600, 'AI 프롬프트 콤팩트 (이미지 없음, ' + BF.aiPrompt(anal, roles).length + '자)');
      // 정리
      S.closePreview();
      S.SK.strokes.length = 0; S.SK.rev++;
      if (bak == null) AW.localStorage.removeItem(key); else AW.localStorage.setItem(key, bak);
      S.loadNow(); reset();
    }
  }

  // ---------- 스케치 4단계: 창 규칙 · 곡선 벽 · DXF 왕복 · 펜 셸 ----------
  group('스케치 4단계 — 창 규칙 · 곡선 벽(호·원) · 스케치 DXF 왕복 · 펜 전용 셸');
  {
    const AW = document.getElementById('app').contentWindow, AD = AW.document;
    const S = AW.WEBCAD_SKETCH, P = AW.WEBCAD_PREP, BF = AW.WEBCAD_BIMIFY;
    if (S && P && BF) {
      reset();
      const key = S.SK.docKey, bak = AW.localStorage.getItem(key);
      const seg = (x1, y1, x2, y2) => Array.from({ length: 25 }, (_, i) => [x1 + (x2 - x1) * i / 24, y1 + (y2 - y1) * i / 24, 0.5]);
      const jig = (pts, s2) => pts.map((p, i) => [p[0] + Math.sin(i * 2 + s2) * 6, p[1] + Math.cos(i * 1.3 + s2) * 6, 0.5]);
      // 창 규칙 + 곡선 벽 분류
      const strokes = [
        { id: 1, color: '#e6e1d3', hw: 8, pts: jig(seg(0, 0, 6000, 20), 1) },
        { id: 2, color: '#e6e1d3', hw: 8, pts: jig(seg(6020, 30, 5990, 4000), 2) },
        { id: 3, color: '#e6e1d3', hw: 8, pts: jig(seg(5980, 4030, 20, 4010), 3) },
        { id: 4, color: '#e6e1d3', hw: 8, pts: jig(seg(-10, 3990, 10, 30), 4) },
        { id: 5, color: '#3a7bd5', hw: 6, pts: jig(seg(1500, 5, 2700, 12), 5) },   // 벽 몸통 위 짧은 평행선
      ];
      const bigArc = []; for (let i = 0; i <= 24; i++) { const t2 = Math.PI + i / 24 * Math.PI / 2; bigArc.push([9000 + Math.cos(t2) * 3000, 2000 + Math.sin(t2) * 3000, 0.5]); }
      strokes.push({ id: 6, color: '#e6e1d3', hw: 8, pts: jig(bigArc, 6) });
      const bigCir = []; for (let i = 0; i <= 40; i++) { const t2 = i / 40 * Math.PI * 2.05; bigCir.push([12000 + Math.cos(t2) * 1500, 5000 + Math.sin(t2) * 1500, 0.5]); }
      strokes.push({ id: 7, color: '#e6e1d3', hw: 8, pts: jig(bigCir, 7) });
      // 비정형 자유곡선 벽 — S자 물결 (직선·호·원 어디에도 안 맞음 → kind 'curve')
      const wave = []; for (let i = 0; i <= 60; i++) { const x2 = i / 60 * 6000; wave.push([x2, 9000 + Math.sin(i / 60 * Math.PI * 2) * 800, 0.5]); }
      strokes.push({ id: 8, color: '#e6e1d3', hw: 8, pts: jig(wave, 8) });
      const anal = P.analyze(strokes);
      const roles = BF.heuristic(anal);
      eqi(roles[5], 'window', '★벽 위 짧은 평행선 → 창');

                // 건물이 없으면 만들지 않는다
                eqi(C.detailSources().length, 0, '  건물이 없으면 상세도 대상이 없다');
                // ── ★층마다 다른 평면 ──
                // 1층과 윗층이 같은 건물은 실제로 드물다(1층 상가·필로티, 윗층 주거).
                // ★구획기는 층을 모르고 '한 판'만 만든다 — 구성이 같은 연속 층을 묶어
                //   그룹마다 한 번씩 부른다. 그래야 층마다 다른 구성을 넣을 수 있다.
                const bP = C.state.entities.length;
                const runP = (opt) => {

                const PB = runP({});
                eqi(PB.nm(1), PB.nm(2), '  기본은 전 층이 같은 구성 (예전 그대로)');
                const PS = runP({ ground: 'shop' });
                ok(/점포/.test(PS.nm(1)) && !/점포/.test(PS.nm(2)),

                eqi(PP.stairBase.join(','), PB.stairBase.join(','),

                // 층마다 다르게 지정
                const PM = runP({ floorProgram: { 1: 'shop', 2: 'office' } });
                ok(/점포/.test(PM.nm(1)) && /업무/.test(PM.nm(2)) && /침실/.test(PM.nm(3)),

                eqi(PM.split.length, 5, '★구성이 다르면 기준층으로 묶지 않는다 (평면 5장)');
                eqi(PB.split.length, 4, '  같으면 묶는다 (평면 4장)');
                // 실번호는 층을 따라간다
                const n2 = PM.rm.filter(r0 => r0.bim.floor === 2).map(r0 => r0.bim.no);
                ok(n2.length > 0 && n2.every(v => v >= 200 && v < 300),
                  '  실번호는 층 백단위 그대로 (2xx)');
                C.state.entities.length = bP;
                // 문장에서 읽는다 — "5동 4층, 1층은 상가"
                if (A.floorGroups) {
                  const G = A.floorGroups({ floors: 4, ground: 'shop' });
                  eqi(G.length, 2, '  구성이 같은 연속 층은 한 그룹 (상가 / 주거)');
                  eqi(G[1].floors.join(''), '234', '  2~4층이 한 그룹');
                }
                // ── ★발코니·처마 ──
                // 2층부터 앞면에 내민다. 1층에 달면 그건 발코니가 아니라 마당이다.
                // ★난간 없는 발코니는 3D 에서 '판만 떠 있는' 꼴이고 실제로도 위법이다.
                const bB = C.state.entities.length;
                const runB = (opt) => {
                  C.state.entities.length = bB;
                  A.buildComplex(Object.assign({ count: 2, floors: 4, w: 9000, d: 11000,
                    roof: 'gable', arrange: 'arc', attached: true, glass: false, lean: 0 }, opt));
                  const es = C.state.entities.slice(bB);
                  const bal = es.filter(e0 => e0.layer === '발코니');
                  const pa = (pts) => { let a2 = 0;
                    for (let i0 = 0, j0 = pts.length - 1; i0 < pts.length; j0 = i0++)
                      a2 += pts[j0][0] * pts[i0][1] - pts[i0][0] * pts[j0][1];
                    return Math.abs(a2) / 2 / 1e6; };
                  const sl = bal.filter(e0 => e0.bim && e0.bim.kind === 'slab');
                  return { es, sl, rl: bal.filter(e0 => e0.bim && e0.bim.kind === 'railing'),
                    tops: [...new Set(sl.map(e0 => e0.bim.top))].sort((a2, b2) => a2 - b2),
                    area: sl.length ? pa(sl[0].points) : 0,
                    foot: es.filter(e0 => e0.bim && e0.bim.kind === 'slab' && e0.bim.t === 150
                      && (e0.bim.top || 0) === 0).reduce((a2, e0) => a2 + pa(e0.points), 0),
                    roofBB: C.entsBBox(es.filter(e0 => e0.bim && e0.bim.kind === 'roof'
                      && e0.layer === '지붕')) };
                };
                const BB = runB({});
                eqi(BB.sl.length, 6, '★발코니 — 2동 × 2~4층 = 6개');
                eqi(BB.tops.join(','), '3000,6000,9000', '★1층에는 달지 않는다 (2층부터)');
                eqi(BB.rl.length, BB.sl.length, '★발코니마다 난간 하나 (판만 떠 있으면 안 된다)');
                ok(BB.rl.every(e0 => e0.bim.h >= 1200), '  난간 높이 1.2m 이상 (규정)');
                ok(BB.area > 4 && BB.area < 14, '  발코니 한 개 ' + BB.area.toFixed(1) + '㎡ (깊이 1.5m)');
                // ★건축면적은 그대로여야 한다 — 발코니가 지상 바닥판으로 세어지면 면적표가 틀린다
                const B0 = runB({ balcony: false });
                eqi(BB.foot.toFixed(2), B0.foot.toFixed(2),
                  '★발코니는 건축면적에 안 들어간다 (' + BB.foot.toFixed(1) + '㎡ 그대로)');
                eqi(B0.sl.length, 0, '  "발코니 없이" 면 달지 않는다');
                eqi(runB({ floors: 1 }).sl.length, 0, '★1층짜리 건물에는 없다');
                // 상가·필로티 층에는 달지 않는다 — 주거 층의 것이다
                const BS = runB({ floorProgram: { 2: 'shop' } });
                ok(!BS.tops.includes(3000) && BS.tops.includes(6000),
                  '★상가 층에는 달지 않는다 (2층 상가 → 3·4층에만)');
                // 처마 — 기본값은 예전 그대로, 옵션으로 깊게
                const BE = runB({ eaveOvh: 600 });
                ok(BE.roofBB.w > BB.roofBB.w,
                  '★처마를 깊게 하면 지붕이 실제로 더 나온다 ('
                  + Math.round(BB.roofBB.w) + ' → ' + Math.round(BE.roofBB.w) + 'mm)');
                eqi(Math.round(BB.roofBB.w), Math.round(runB({ eaveOvh: 300 }).roofBB.w),
                  '  기본값(300)은 예전 그대로 — 말하지 않으면 안 바뀐다');
                C.state.entities.length = bB;
                // ── ★면적표 — 용도별·발코니·필로티 ──
                // 층마다 용도가 다른데 합계만 내면 인허가 서류를 못 쓴다.
                // ★실이 제 용도를 달고 있어야 한다 — 이름으로 되짚으면 '복도'·'화장실'이
                //   어느 용도인지 알 수가 없다.
                // ★면적표는 도면 전체를 훑는다 — 앞 시험이 남긴 도형이 섞이면 합계가 틀린다.
                //   잠깐 비웠다가 그대로 돌려놓는다(길이만 줄이면 되돌릴 수 없다).
                const savedU = C.state.entities.slice();
                C.state.entities.length = 0;
                A.buildComplex({ count: 2, floors: 5, w: 9000, d: 11000, roof: 'gable',
                  arrange: 'arc', attached: true, glass: false, lean: 0,
                  floorProgram: { 1: 'shop', 2: 'office', 3: 'piloti' } });
                const dU = C.areaData();
                const useMap = new Map(dU.byUse);
                eqi(dU.byUse.length, 3, '★용도가 셋으로 갈린다 (근린생활·업무·주거)');
                ok(useMap.has('근린생활시설') && useMap.has('업무시설') && useMap.has('주거'),
                  '  용도 이름 — ' + dU.byUse.map(x => x[0]).join(' · '));
                // ★합이 연면적과 맞아야 표가 성립한다
                const sumU = dU.byUse.reduce((a2, x) => a2 + x[1], 0);
                ok(Math.abs(sumU - dU.gross) < 0.02,
                  '★용도별 합 = 연면적 (' + sumU.toFixed(2) + ' = ' + dU.gross.toFixed(2) + '㎡)');
                // 1층 상가 = 한 층치, 4·5층 주거 = 두 층치
                ok(Math.abs(useMap.get('주거') / useMap.get('근린생활시설') - 2) < 0.02,
                  '  주거(4·5층)가 상가(1층)의 두 배 — 층수대로 잡힌다');
                // ★발코니는 연면적에 넣지 않는다 (서비스 면적)
                ok(dU.balcony > 0, '★발코니 면적을 따로 낸다 (' + dU.balcony.toFixed(1) + '㎡)');
                ok(dU.gross < sumU + dU.balcony - 1,
                  '  연면적에는 발코니가 안 들어가 있다');
                // ★필로티는 바닥면적에 산입하지 않는다 — 층은 있는데 면적이 없는 이유를 적는다
                eqi(dU.piloti.join(','), '3', '★필로티 층을 짚어낸다 (3층)');
                const rowsU = C.areaRows(0).map(r0 => r0[0] + '|' + r0[1]);
                ok(rowsU.some(v => /^용도별\|근린생활시설/.test(v)), '  표에 용도별 줄이 있다');
                ok(rowsU.some(v => /발코니 \(연면적 제외\)/.test(v)), '★표가 "연면적 제외"를 밝힌다');
                ok(rowsU.some(v => /필로티 3층 \(바닥면적 제외\)/.test(v)),
                  '★필로티도 "바닥면적 제외"를 밝힌다 (빠진 게 아니라 뺀 것이다)');
                // 용도를 안 준 옛 모델도 표가 나온다
                C.state.entities.length = 0;
                A.buildComplex({ count: 1, floors: 2, w: 9000, d: 11000, roof: 'gable',
                  arrange: 'arc', attached: true, glass: false, lean: 0 });
                for (const e0 of C.state.entities) if (e0.bim && e0.bim.kind === 'room') delete e0.bim.use;
                const dU2 = C.areaData();
                eqi(dU2.byUse.length, 1, '  용도가 없는 옛 모델은 주거 하나로 (표가 비지 않는다)');
                eqi(dU2.byUse[0][0], '주거', '  기본값 주거');
                C.state.entities.length = 0;
                for (const e0 of savedU) C.state.entities.push(e0);
                // ── ★복도·계단 ──
                // 방끼리 직접 연결하면 안방을 지나야 다른 방이 나온다. 뒤쪽에 복도 띠를 두고
                // 방들이 거기로 열리게 한다(앞은 주 실이 차지해 마당 조망을 갖는다).
                const runC = (opt) => {
                  C.state.entities.length = bR;
                  A.buildComplex(Object.assign({ count: 3, floors: 1, w: 9000, d: 11000,
                    roof: 'gable', arrange: 'arc', attached: true, glass: false, lean: 0 }, opt));
                  const es = C.state.entities.slice(bR);
                  return {
                    corr: es.filter(e0 => e0.bim && e0.bim.kind === 'room' && e0.bim.name === '복도'),
                    stair: es.filter(e0 => e0.bim && e0.bim.kind === 'stair'),
                    idoor: es.filter(e0 => e0.bim && e0.bim.ot === 'door' && e0.bim.t === 100),
                  };
                };
                const C1 = runC({});
                eqi(C1.corr.length, 3, '★복도 — 동마다 하나');
                ok(C1.corr.every(e0 => e0.bim.areaM2 > 5), '  복도도 면적을 가진 실이다');
                // ★쐐기는 앞이 좁다 — 매개변수 폭을 그대로 쓰면 복도가 앞에서 유효폭 미만이 된다
                const cwid = C1.corr.map(e0 => Math.hypot(e0.points[1][0] - e0.points[0][0],
                  e0.points[1][1] - e0.points[0][1]));
                ok(Math.min.apply(null, cwid) >= 1150,
                  '★복도는 가장 좁은 앞쪽에서도 유효폭 1.2m ('
                    + Math.round(Math.min.apply(null, cwid)) + 'mm)');
                eqi(C1.stair.length, 0, '  1층이면 계단 없음');
                // 방들이 복도로 열리는가 — 문 한쪽이 복도 안이면 복도에 면한 것
                const inP = (p, x, y) => { let c0 = false;
                  for (let i0 = 0, j0 = p.length - 1; i0 < p.length; j0 = i0++)
                    if (((p[i0][1] > y) !== (p[j0][1] > y)) &&
                        (x < (p[j0][0] - p[i0][0]) * (y - p[i0][1]) / (p[j0][1] - p[i0][1]) + p[i0][0]))
                      c0 = !c0;
                  return c0; };
                let onC = 0;
                for (const d0 of C1.idoor) {
                  const mx0 = (d0.x1 + d0.x2) / 2, my0 = (d0.y1 + d0.y2) / 2;
                  const dd0 = Math.hypot(d0.x2 - d0.x1, d0.y2 - d0.y1) || 1;
                  const nx0 = -(d0.y2 - d0.y1) / dd0, ny0 = (d0.x2 - d0.x1) / dd0;
                  if (C1.corr.some(cc => inP(cc.points, mx0 + nx0 * 500, my0 + ny0 * 500)
                    || inP(cc.points, mx0 - nx0 * 500, my0 - ny0 * 500))) onC++;
                }
                // ★모든 방이 복도로 열려야 한다 — 뒤쪽 복도 띠만 뒀을 땐 21개 중 6개뿐이었다.
                //   복도를 앞뒤로 관통시키고(중복도) 방을 양쪽 밴드에 깊이로만 나누면
                //   밴드의 모든 방이 복도변에 자기 면을 갖는다.
                eqi(onC, C1.idoor.length,
                  '★내부 문이 전부 복도로 열린다 (' + onC + '/' + C1.idoor.length + ')');
                // ★면적 비례로만 나누면 욕실이 90cm 깊이가 된다 — 최소 실 깊이를 보장한다
                const rmAll = C.state.entities.slice(bR)
                  .filter(e0 => e0.bim && e0.bim.kind === 'room' && e0.bim.floor === 1
                    && e0.bim.name !== '복도');
                const minDim = Math.min.apply(null, rmAll.map(e0 => {
                  const xs0 = e0.points.map(p0 => p0[0]), ys0 = e0.points.map(p0 => p0[1]);
                  return Math.min(Math.max.apply(null, xs0) - Math.min.apply(null, xs0),
                    Math.max.apply(null, ys0) - Math.min.apply(null, ys0)); }));
                ok(minDim >= 1700, '★가장 얇은 실도 ' + Math.round(minDim) + 'mm — 방이라 할 수 있는 두께');
                ok(Math.min.apply(null, rmAll.map(e0 => e0.bim.areaM2)) >= 4,
                  '  가장 작은 실도 4㎡ 이상');
                const C3 = runC({ floors: 3 });
                eqi(C3.stair.length, 6, '★2층 이상이면 계단 — 동마다 층 전환 수만큼 (3층×3동)');
                ok(C3.stair.every(e0 => e0.bim.h > 0 && e0.bim.riser > 0 && e0.bim.w > 0),
                  '  계단에 폭·높이·단높이가 들어 있다 (cad.js 가 평면 심볼과 3D 를 만든다)');
                const CS = runC({ w: 3000 });
                eqi(CS.corr.length, 0, '★좁은 동에는 복도를 넣지 않는다 (밴드가 성립하지 않는다)');
                // ── ★3D 마감 — 계단 난간 · 대지 ──
                C.state.entities.length = bR;
                A.buildComplex({ count: 3, floors: 2, w: 9000, d: 11000, roof: 'gable',
                  arrange: 'arc', attached: true, glass: false, lean: 0 });
                const esF = C.state.entities.slice(bR), solF = C.bimSolids();
                // ★계단 난간만 센다 — 발코니 난간(레이어 '발코니')과 섞이면 무엇을 재는지 흐려진다
                const railE = esF.filter(e0 => e0.bim && e0.bim.kind === 'railing' && e0.layer !== '발코니');
                eqi(railE.length, 3, '★계단 난간 — 계단마다 하나 (난간 없는 계단은 위법이다)');
                const railIds = new Set(railE.map(e0 => e0.id));
                const railS = solF.filter(s0 => railIds.has(s0.eid));
                ok(railS.length >= 6, '  난간이 3D 솔리드로 선다 (' + railS.length + '개)');
                ok(Math.max.apply(null, railS.map(s0 => s0.z1 != null ? s0.z1 : s0.z0)) > 2000,
                  '  경로에 높이가 있어 난간이 계단 경사를 따라간다');
                const siteE = esF.filter(e0 => e0.layer === '대지');
                eqi(siteE.length, 1, '★대지 슬래브 — 건물이 허공에 떠 있지 않게');
                const siteS = solF.filter(s0 => s0.eid === siteE[0].id);
                const others = solF.filter(s0 => s0.eid !== siteE[0].id);
                const sTop = Math.max.apply(null, siteS.map(s0 => s0.z1 != null ? s0.z1 : s0.z0));
                const bLow = Math.min.apply(null, others.map(s0 => s0.z0));
                ok(sTop <= bLow, '★지면이 건물 바닥판을 뚫지 않는다 (지면 ' + sTop
                  + ' ≤ 최하단 ' + bLow + ')');
                const spts = siteE[0].points;
                let mx0 = 1e18, mx1 = -1e18;
                esF.forEach(e0 => { if (e0.layer === '대지') return;
                  const xs0 = e0.type === 'LINE' ? [e0.x1, e0.x2]
                    : e0.points ? e0.points.map(p0 => p0[0]) : [e0.x || 0];
                  xs0.forEach(v0 => { mx0 = Math.min(mx0, v0); mx1 = Math.max(mx1, v0); }); });
                ok(Math.min.apply(null, spts.map(p0 => p0[0])) < mx0
                  && Math.max.apply(null, spts.map(p0 => p0[0])) > mx1,

    // 속이 비었는가: 중심은 어떤 밴드에도 안 들어가고, 벽 두께 위치에는 있어야
    const sol = C.bimSolids();
    const inP = (p, poly) => { let ins = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1]; if (((yi > p[1]) !== (yj > p[1])) && (p[0] < (xj - xi) * (p[1] - yi) / (yj - yi) + xi)) ins = !ins; } return ins; };
    ok(!sol.some(s => inP([0, 0], s.poly)), '★가운데가 비어 있다 (관통)');
    ok(sol.some(s => inP([490, 0], s.poly)), '  벽은 중심선 위에 있다');

    reset();
    setEnts([{ type: 'CIRCLE', cx: 0, cy: 0, r: 500, layer: '0', bim: { kind: 'column', h: 3000, base: 0 } }]);

    eqi(cs[0].poly.length, 64, '  원기둥도 64각');
    ok(cs[0].curv === true, '  곡면 표시');
    // 렌더 픽셀: 곡면엔 세로 잔선이 없고, 각진 개체는 모서리가 남는다
    if (C.v3 && C.v3.cv) {
      const V = C.v3, cvv = V.cv;
      const w0 = cvv.width, h0 = cvv.height;
      cvv.width = 400; cvv.height = 400; V.quad = false;
      const cx2 = cvv.getContext('2d');
      // 배경·테마 무관 지표: 실루엣 내부의 '짧은 비표면 틈(≤6px)' = 표면을 가로지르는 모서리 선.
      // 모서리 잉크는 배경색과 가까워(다크 테마) '표면'으로 안 잡히고, 두 표면 사이의 틈으로 나타난다.
      // 곡면(원통)은 구로 셰이딩으로 표면이 연속 → 틈 0. 각진 개체는 모서리마다 틈이 생긴다.
      const shoot = () => {
        V.solids = C.bimSolids(); C.fit3D();
        V.yaw = -0.6; V.pitch = 0.5; V.zoom = 1; V.panX = 0; V.panY = 0; V._fast = false;
        C.render3D();
        const W = 400, im = cx2.getImageData(0, 0, W, 400).data;
        const bp = (2 * W + 2) * 4, bR = im[bp], bG = im[bp + 1], bB = im[bp + 2]; // 배경(빈 구석)
        const isSurf = (p) => im[p + 3] === 255 && (Math.abs(im[p] - bR) + Math.abs(im[p + 1] - bG) + Math.abs(im[p + 2] - bB)) > 60;
        let gaps = 0, surf = 0;
        for (const y of [170, 200, 230]) {
          let first = -1, last = -1;
          for (let x = 0; x < W; x++) if (isSurf((y * W + x) * 4)) { if (first < 0) first = x; last = x; surf++; }
          if (first < 0) continue;
          let x = first;
          while (x <= last) {
            if (!isSurf((y * W + x) * 4)) { let len = 0; while (x <= last && !isSurf((y * W + x) * 4)) { len++; x++; } if (len >= 1 && len <= 6) gaps++; }
            else x++;
          }
        }
        return { gaps, surf };
      };
      const cyl = shoot();
      ok(cyl.surf > 50, `원기둥이 화면에 그려짐 (${cyl.surf}px)`);
      eqi(cyl.gaps, 0, '★곡면 표면에 세로 잔선(내부 틈) 0 — 분절 이음선 숨김');
      reset();
      setEnts([{ type: 'LWPOLYLINE', closed: true, layer: '0', points: [[-500,-500],[500,-500],[500,500],[-500,500]], bim: { kind: 'column', h: 3000, base: 0 } }]);
      const box = shoot();

      cvv.width = w0; cvv.height = h0;
    }
    reset();

  // ---------- 2026-07-20 6차 — 라이노식 궤도(줌 비례 감도 + 보던 지점 고정) ----------
  group('궤도 회전 — 줌에 반비례하는 감도 · 화면 중앙 지점 유지 (라이노식)');
  {
    const AW = document.getElementById('app').contentWindow, AD = AW.document;
    reset();
    setEnts([{ type: 'LWPOLYLINE', closed: true, layer: '0',
      points: [[0,0],[4000,0],[4000,3000],[0,3000]], bim: { kind: 'column', h: 2500, base: 0 } }]);
    C.open3D && C.open3D();
    const V = C.v3;
    if (V && V.cv) {
      const cvv = V.cv, w0 = cvv.width, h0 = cvv.height;
      cvv.width = 800; cvv.height = 600; V.quad = false;
      // 평면·입면(fixed) 칸에서는 우드래그가 '이동'이다 — 궤도 검사는 3D 칸에서
      const di = V.views.findIndex((w, i) => !C.vpIsPlan(i) && !w.fixed);
      V.act = di >= 0 ? di : V.act;
      V.solids = C.bimSolids(); C.fit3D();
      const rc = cvv.getBoundingClientRect();
      const orbit = (px) => { // 우드래그 = 궤도
        const x0 = rc.left + 300, y0 = rc.top + 300;
        const ev = (t, x, b) => cvv.dispatchEvent(new AW.PointerEvent(t, { bubbles: true, cancelable: true,
          clientX: x, clientY: y0, button: 2, buttons: b, pointerId: 9, pointerType: 'mouse' }));
        ev('pointerdown', x0, 2);
        for (let i = 1; i <= 10; i++) ev('pointermove', x0 + i * (px / 10), 2);
        ev('pointerup', x0 + px, 0);
      };
      const run = (zoom) => {
        V.yaw = -0.6; V.pitch = 0.5; V.zoom = zoom; V.panX = 0; V.panY = 0; C.render3D();
        const vp = V.vp || { x: 0, y: 0, w: cvv.width, h: cvv.height };
        const ccx = vp.x + vp.w / 2, ccy = vp.y + vp.h / 2;
        const seen = C.unproj3D(ccx, ccy, V.cz);   // 지금 화면 중앙에 보이는 점
        const yaw0 = V.yaw;
        orbit(100);
        const now = C.proj3D(seen[0], seen[1], V.cz);
        return { d: V.yaw - yaw0, drift: Math.hypot(now[0] - ccx, now[1] - ccy) };
      };
      const a1 = run(1), a4 = run(4), a25 = run(25);
      ok(Math.abs(a1.d) > 0.5, `★멀리서(줌 1) 볼 때는 크게 돈다 (Δyaw ${a1.d.toFixed(2)})`);
      eq(a4.d, a1.d / 2, '★줌 4배 = 회전 감도 1/2', 1e-6);
      eq(a25.d, a1.d / 5, '★줌 25배 = 회전 감도 1/5 (√배율 반비례)', 1e-6);
      ok(a1.drift < 1.5 && a4.drift < 1.5 && a25.drift < 1.5,
        `★보던 지점이 화면 중앙에 그대로 (이동 ${Math.max(a1.drift, a4.drift, a25.drift).toFixed(2)}px)`);
      // 회전 자체는 여전히 동작 (감도만 줄어들 뿐 멈추지 않는다)
      V.zoom = 400; V.panX = 0; V.panY = 0;
      const y0 = V.yaw; orbit(120);
      ok(Math.abs(V.yaw - y0) > 1e-3, '  아주 많이 확대해도 회전은 된다(감도만 미세)');
      V.zoom = 1; V.panX = 0; V.panY = 0;
      cvv.width = w0; cvv.height = h0;
    } else ok(true, '(3D 훅 없음)');
    reset();
  }

      ok(px(760, 30) === '255,255,255', '  작업 표시로 돌아오면 흰색');
      // 다크 테마 = 캔버스 어둠색
      AD.documentElement.classList.remove('light');
      C.render3D();
      const dc = px(760, 30);
      ok(dc !== '255,255,255', '★다크 테마에선 어두운 캔버스색을 따른다');
      cvv.width = w0; cvv.height = h0;
    } else ok(true, '(3D 훅 없음)');
    reset();
  }

  // ---------- 2026-07-27 층 전환 단추 ----------
  group('층 전환 단추 — 명령과 같은 상태를 본다 · 층이 하나면 나타나지 않는다');
  {
    const AW = document.getElementById('app').contentWindow, AD = AW.document;
    reset();
    if (C.close3D) C.close3D();                    // 3D 가 떠 있으면 단추를 숨긴다(설계)
    const el = AD.getElementById('floorBar');
    ok(!!el, '★층 전환 단추가 캔버스 위에 있다');
    // 층이 하나면 띄우지 않는다 — 쓸 데 없는 단추로 화면을 채우지 않는다
    C.renderFloorBar();
    eqi(el.style.display, 'none', '★빈 도면·1층 도면에서는 나타나지 않는다');
    const A2 = AW.PARTI_ARCH;
    A2.buildComplex({ count: 2, floors: 3, w: 9000, d: 11000, roof: 'gable',
      arrange: 'arc', attached: true, glass: false, lean: 0 });
    C.renderFloorBar();
    eqi(el.style.display, 'flex', '★3층 건물을 만들면 나타난다');
    const btns = [...el.querySelectorAll('.fbBtn')].map(b => b.textContent);
    eqi(btns.join(' '), '지붕 3F 2F 1F 전체', '★위에서부터 지붕 → 3F → 2F → 1F → 전체');
    const onOf = () => [...el.querySelectorAll('.fbBtn')]
      .filter(b => b.classList.contains('on')).map(b => b.textContent).join(',');
    eqi(onOf(), '전체', '  처음에는 전체가 켜져 있다');
    // 단추 → 상태
    [...el.querySelectorAll('.fbBtn')].find(b => b.textContent === '2F').click();
    eqi(C.state.planFloor, 2, '★2F 단추 = 2층만 보기');
    eqi(onOf(), '2F', '  누른 단추가 켜진다');
    ok(C.state.entities.filter(e0 => C.onLv(e0)).length < C.state.entities.length,
      '  실제로 가려진다');
    // ★명령으로 바꿔도 단추가 따라와야 한다 — 단추가 제 상태를 따로 들면 둘이 어긋난다
    C.cmdFloorView('지붕');
    eqi(onOf(), '지붕', '★명령("층보기 지붕")으로 바꿔도 단추가 따라온다');
    [...el.querySelectorAll('.fbBtn')].find(b => b.textContent === '전체').click();
    eqi(C.state.planFloor, null, '★전체 단추 = 되돌리기');
    eqi(C.state.entities.filter(e0 => C.onLv(e0)).length, C.state.entities.length,
      '  전부 다시 보인다');
    // 3D 를 열면 숨긴다 (평면 전용 필터라 3D 에서는 뜻이 없다)
    if (C.open3D) {
      C.open3D(); C.renderFloorBar();
      eqi(el.style.display, 'none', '★3D 뷰에서는 숨긴다 (평면 전용)');
      C.close3D(); C.renderFloorBar();
      eqi(el.style.display, 'flex', '  평면으로 돌아오면 다시 나타난다');
    }
    reset();
    C.renderFloorBar();
    eqi(el.style.display, 'none', '  도면을 비우면 사라진다');
  }
}

document.getElementById('rerun').addEventListener('click', () => { if(T) runAll(); });
document.getElementById('app').addEventListener('load', () => {
  setTimeout(() => {
    T = document.getElementById('app').contentWindow.__CADTEST__;
    if (!T) { S.innerHTML = '<span class="fail">__CADTEST__ 훅을 찾을 수 없습니다 (cad.js 로드 실패?)</span>'; return; }
    runAll();
  }, 300);
});
</script>
</body>
</html>
